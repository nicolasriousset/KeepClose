schema: spec-driven

context: |
  Language: fr
  All artifacts must be written in fr.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projet : KeepClose v2 — détection de proximité BLE pour personnes malvoyantes
  (alerte si la canne blanche sort du périmètre).
  Matériel : 2 × Seeed Studio XIAO BLE nRF52840 (bracelet « scanner » + « tag » balise), batterie LiPo.
  Firmware Arduino (.ino / .h) : firmware/common, firmware/scanner, firmware/tag, firmware/test.
  Variantes de build scanner : project_nico.h, project_tipoucet.h.
  Contraintes : autonomie batterie, retours haptiques/sonores simples (utilisateurs malvoyants),
  LEDs intégrées active LOW.
  Documentation utilisateur/technique : README.md, doc/. Planification BMad : _bmad-output/.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
